<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#edf2ee" />
  <title>Solma Shop Business</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260912-1">
</head>

<body>

  <!-- Connexion -->

  <section class="auth-screen" id="auth-screen">
    <div class="auth-card glass-card">

      <div class="brand auth-brand">
        <div class="brand-mark">S</div>
        <div class="brand-text">
          <strong>Solma</strong>
          <span>Shop Business</span>
        </div>
      </div>

      <p class="eyebrow">Espace propriétaire</p>

      <h1>Bienvenue dans votre espace.</h1>

      <p class="subtle">
        Connectez-vous pour gérer vos deux magasins.
      </p>

      <div class="auth-modes">
        <button type="button" class="auth-mode active" data-auth-mode="admin">
          Propriétaire
        </button>

        <button type="button" class="auth-mode" data-auth-mode="personnel">
          Personnel
        </button>
      </div>

      <form id="admin-login-form" class="auth-form" autocomplete="off">

        <div class="field admin-field">
          <label for="admin-email">Adresse email</label>
          <input id="admin-email" type="email" autocomplete="email" required placeholder="vous@exemple.com">
        </div>

        <div class="field admin-field">
          <label for="admin-password">Mot de passe</label>
          <input id="admin-password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe">
        </div>

        <div class="field personnel-field hidden-field">
          <label for="personnel-phone">Numéro de téléphone</label>
          <input id="personnel-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="77 000 00 00">
        </div>

        <div class="field personnel-field hidden-field">
          <label for="personnel-pin">Code à 4 chiffres</label>
          <input id="personnel-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
        </div>

        <p class="auth-error" id="auth-error"></p>

        <button class="btn btn-primary" type="submit" id="admin-login-button">
          Se connecter
        </button>

      </form>

    </div>
  </section>

  <!-- Décor -->

  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="ambient ambient-three"></div>

  <button class="mobile-menu icon-button" id="mobile-menu" aria-label="Réduire le menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="app-shell">

    <!-- Sidebar -->

    <aside class="sidebar" id="sidebar">

      <!-- Profil -->

      <div class="profile-chip">

        <div class="avatar" id="profile-avatar">
          AM
        </div>

        <div class="profile-text">
          <strong id="profile-name">Compte propriétaire</strong>
          <span id="profile-role">Administrateur</span>
        </div>

        <button class="icon-button" aria-label="Modifier le profil" data-action="edit-profile">
          •••
        </button>

      </div>

      <!-- Navigation -->

      <nav class="main-nav" aria-label="Navigation principale">

        <p class="nav-label">Vue d'ensemble</p>

        <div class="nav-group">

        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </span>
          <span class="nav-text">Tableau de bord</span>
        </button>

        <button class="nav-item" data-view="sales">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 17 9 11 13 15 21 7"/>
              <polyline points="14 7 21 7 21 14"/>
            </svg>
          </span>
          <span class="nav-text">Ventes</span>
        </button>

        <button class="nav-item" data-view="cash">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/>
              <path d="M18 12h.01"/>
              <path d="M3 9h13"/>
            </svg>
          </span>
          <span class="nav-text">Caisses</span>
        </button>

        <button class="nav-item" data-view="expenses">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 7 9 13 13 9 21 17"/>
              <polyline points="14 17 21 17 21 10"/>
            </svg>
          </span>
          <span class="nav-text">Dépenses</span>
        </button>

        </div>

        <p class="nav-label management-label">Gestion</p>

        <div class="nav-group">

        <button class="nav-item" data-view="products">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 8l-9-5-9 5 9 5 9-5Z"/>
              <path d="M3 8v8l9 5 9-5V8"/>
              <path d="M12 13v8"/>
            </svg>
          </span>
          <span class="nav-text">Produits</span>
        </button>

        <button class="nav-item" data-view="team">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <span class="nav-text">Personnel</span>
        </button>

        <button class="nav-item" data-view="reports">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="20" x2="12" y2="10"/>
              <line x1="18" y1="20" x2="18" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="16"/>
            </svg>
          </span>
          <span class="nav-text">Rapports</span>
        </button>

        </div>

      </nav>

      <button class="logout">

        <span class="nav-icon">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>

        </span>

        <span class="logout-text">Se déconnecter</span>

      </button>

      <!-- Footer -->

      <div class="sidebar-footer">

        <div class="help-card">
          <span>Besoin d'aide ?</span>
          <strong>
            Centre de ressources
            <span>↗</span>
          </strong>
        </div>

      </div>

    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Contenu -->

    <main class="main-content">

      <!-- Topbar -->

      <header class="topbar">

        <div class="header-navigation">

          <div class="breadcrumb">
            <span>Solma Shop</span>
            <b>/</b>
            <strong id="breadcrumb-current">Tableau de bord</strong>
          </div>

        </div>

        <div class="topbar-brand">
          <div class="brand-mark">S</div>
          <div class="brand-text">
            <strong>Solma</strong>
            <span>Shop Business</span>
          </div>
        </div>

        <div class="topbar-actions">

          <div class="store-selector" id="store-selector-custom">

            <span class="status-dot"></span>

            <button type="button" class="store-selector-trigger" id="store-selector-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span id="store-selector-label">Tous les magasins</span>
              <span class="store-selector-caret">▾</span>
            </button>

            <div class="store-selector-menu" id="store-selector-menu" role="listbox">
              <button type="button" class="store-selector-option active" data-value="all" role="option">Tous les magasins</button>
              <button type="button" class="store-selector-option" data-value="solma shop 1" role="option">Solma Shop 1</button>
              <button type="button" class="store-selector-option" data-value="solma shop 2" role="option">Solma Shop 2</button>
            </div>

            <select id="store-filter" style="display:none">

              <option value="all">Tous les magasins</option>
              <option value="solma shop 1">Solma Shop 1</option>
              <option value="solma shop 2">Solma Shop 2</option>

            </select>

          </div>


        </div>

      </header>

      <div class="page-content" id="page-content"></div>

    </main>

  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js?v=20260911-1"></script>
  <script src="app.js?v=20260911-1"></script>

</body>
</html>
