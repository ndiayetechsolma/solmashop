<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#edf2ee" />
  <title>Solma Shop Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="auth-screen" id="auth-screen">
    <div class="auth-card glass-card">
      <div class="brand auth-brand"><div class="brand-mark">S</div><div><strong>Solma</strong><span>Shop Business</span></div></div>
      <p class="eyebrow">Espace propriétaire</p>
      <h1>Bienvenue dans votre espace.</h1>
      <p class="subtle">Connectez-vous pour gérer vos deux magasins.</p>
      <div class="auth-modes"><button type="button" class="auth-mode active" data-auth-mode="admin">Propriétaire</button><button type="button" class="auth-mode" data-auth-mode="personnel">Personnel</button></div>
      <form id="admin-login-form" class="auth-form" autocomplete="off">
        <div class="field admin-field"><label for="admin-email">Adresse email</label><input id="admin-email" type="email" autocomplete="email" required placeholder="vous@exemple.com" /></div>
        <div class="field admin-field"><label for="admin-password">Mot de passe</label><input id="admin-password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe" /></div>
        <div class="field personnel-field hidden-field"><label for="personnel-phone">Numéro de téléphone</label><input id="personnel-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="77 000 00 00" /></div>
        <div class="field personnel-field hidden-field"><label for="personnel-pin">Code à 4 chiffres</label><input id="personnel-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" /></div>
        <p class="auth-error" id="auth-error" role="alert"></p>
        <button class="btn btn-primary" type="submit" id="admin-login-button">Se connecter</button>
      </form>
    </div>
  </section>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <strong>Solma</strong>
          <span>Shop Business</span>
        </div>
      </div>
      <div class="profile-chip">
        <div class="avatar">AM</div>
        <div><strong id="profile-name">Compte propriétaire</strong><span id="profile-role">Administrateur</span></div>
        <button class="icon-button" aria-label="Modifier le profil" data-action="edit-profile">•••</button>
      </div>
      <nav class="main-nav" aria-label="Navigation principale">
        <p class="nav-label">Vue d’ensemble</p>
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span> Tableau de bord</button>
        <button class="nav-item" data-view="sales"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg></span> Ventes</button>
        <button class="nav-item" data-view="cash"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M18 12h.01"/><path d="M3 9h13"/></svg></span> Caisses</button>
        <button class="nav-item" data-view="expenses"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 7 9 13 13 9 21 17"/><polyline points="14 17 21 17 21 10"/></svg></span> Dépenses</button>
        <p class="nav-label management-label">Gestion</p>
        <button class="nav-item" data-view="products"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span> Produits</button>
<button class="nav-item" data-view="team"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Personnel</button>
<button class="nav-item" data-view="reports"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span> Rapports</button>
      </nav>
      <div class="sidebar-footer">
        <div class="help-card"><span>Besoin d’aide ?<strong>Centre de ressources <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span></strong></div>
        <button class="logout"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Se déconnecter</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="header-navigation"><button class="mobile-menu icon-button" id="mobile-menu" aria-label="Ouvrir le menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><button class="header-menu-button" id="header-menu-button" aria-expanded="false">Menu <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:10px;height:10px"><polyline points="6 9 12 15 18 9"/></svg></span></button><div class="header-menu" id="header-menu"><button data-view-link="dashboard">Tableau de bord</button><button data-view-link="sales">Ventes</button><button data-view-link="cash">Caisses</button><button data-view-link="expenses">Dépenses</button><button data-view-link="collection">Collection</button><button data-view-link="products">Produits</button><button data-view-link="team">Personnel</button><button data-view-link="reports">Rapports</button></div></div>
        <div class="breadcrumb"><span>Solma Shop</span><b>/</b><strong id="breadcrumb-current">Tableau de bord</strong></div>
        <div class="topbar-actions">
          <button class="btn btn-light header-quick-sale" data-action="new-sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M12 5v14M5 12h14"/></svg> Vente rapide</button>
          <div class="store-selector"><span class="status-dot"></span><select id="store-filter"><option value="all">Tous les magasins</option><option value="plateau">Plateau</option><option value="medina">Médina</option></select><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:10px;height:10px"><polyline points="6 9 12 15 18 9"/></svg></span></div>
          <button class="icon-button notification" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><i></i></button>
          <div class="top-avatar" id="top-avatar">AD</div>
        </div>
      </header>

      <div class="page-content" id="page-content"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js?v=20260907-2"></script>
  <script src="app.js?v=20260907-2"></script>
  <script>
    document.querySelector('#header-menu-button').addEventListener('click', () => document.querySelector('#header-menu').classList.toggle('open'));
  </script>
</body>
</html>
